music_directory "$HOME/Music/musiqgw"
playlist_directory "$HOME/Music/mpd/playlists"

auto_update "yes" # enables automatic update of MPD's database when files in music_directory are changed.  (Linux only)
restore_paused "yes" # pause at startup
bind_to_address "127.0.0.1"

audio_output {
	type "pipewire"
	name "Pipewire Output"
}
