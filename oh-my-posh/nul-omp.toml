osc7 = true
pwd = 'osc7'
console_title_template = '{{ .Shell }}({{ .Folder }})'
version = 3
final_space = true

[palette]
  green = '#04FF04'
  red = '#FF0404'
  go = '#4B95E9'
  node = '#59C9A5'
  python = '#F3AE35'

[secondary_prompt]
  template = ' '
  foreground = 'p:green'
  background = 'transparent'

[transient_prompt]
  template = ' '
  foreground = 'p:green'
  background = 'transparent'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    leading_diamond = '╭─'
    trailing_diamond = ''
    template = ' {{ path .Path .Location }} '
    foreground = 'transparent'
    background_templates = ['{{if gt .Code 0}}p:red{{end}}', '{{if eq .Code 0}}p:green{{end}}']
    background = 'p:green'
    type = 'path'
    style = 'diamond'

    [blocks.segments.properties]
      cache_duration = 'none'
      styles = 'full'
  
  [[blocks.segments]]
    template = ' {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} '
    foreground = 'p:green'
    background = 'transparent'
    type = 'git'
    style = 'plain'
    foreground_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}p:green{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}white{{ end }}', '{{ if gt .Ahead 0 }}white{{ end }}']

    [blocks.segments.properties]
      branch_template = '{{ trunc 25 .Branch }}'
      fetch_status = true
      fetch_upstream_icon = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '╰─'
    background = 'transparent'
    type = 'text'
    style = 'plain'
    foreground_templates = ['{{if gt .Code 0}}p:red{{end}}', '{{if eq .Code 0}}p:green{{end}}']

    [blocks.segments.properties]
      cache_duration = 'none'

[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  [[blocks.segments]]
    template = ' '
    foreground = 'p:node'
    background = 'transparent'
    type = 'node'
    style = 'plain'

    [blocks.segments.properties]
      display_mode = 'files'
      fetch_package_manager = false
      home_enabled = false

  [[blocks.segments]]
    template = ' '
    foreground = 'p:go'
    background = 'transparent'
    type = 'go'
    style = 'plain'

    [blocks.segments.properties]
      fetch_version = false

  [[blocks.segments]]
    template = ' '
    foreground = 'p:python'
    background = 'transparent'
    type = 'python'
    style = 'plain'

    [blocks.segments.properties]
      display_mode = 'files'
      fetch_version = false
      fetch_virtual_env = false

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '<i>{{ .Name }}</i>'
    foreground = 'black'
    background = 'p:green'
    type = 'shell'
    style = 'diamond'

  [[blocks.segments]]
    foreground = 'transparent'
    background = 'p:green'
    type = 'executiontime'
    template = '{{ .FormattedMs }}'
    style = 'diamond'

    [blocks.segments.properties]
      cache_duration = 'none'
      threshold = 500
